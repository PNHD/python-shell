name: TEMP Public Grid Top20 Backtest

on:
  pull_request:
    branches: [master]
    paths:
      - 'grid_research/grid_runner.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  sweep:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        symbol: [BTCUSDT, ETHUSDT, BNBUSDT, XRPUSDT, SOLUSDT, TRXUSDT, DOGEUSDT, ZECUSDT, ADAUSDT, LINKUSDT, XLMUSDT, BCHUSDT, LTCUSDT, HBARUSDT, SUIUSDT, AVAXUSDT, SHIBUSDT, UNIUSDT, NEARUSDT, DOTUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install numpy pandas requests numba
      - name: Sweep ${{ matrix.symbol }}
        run: python grid_research/grid_runner.py ${{ matrix.symbol }}
      - name: Upload ${{ matrix.symbol }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-${{ matrix.symbol }}
          path: out/${{ matrix.symbol }}.csv
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: grid-*
          path: downloaded
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aggregate
        run: |
          pip install pandas
          python - <<'PY'
          import glob,pandas as pd
          fs=glob.glob('downloaded/*.csv')
          xs=[]
          for f in fs:
              try:
                  x=pd.read_csv(f)
                  if len(x): xs.append(x)
              except Exception: pass
          z=pd.concat(xs,ignore_index=True) if xs else pd.DataFrame()
          z.to_csv('grid_top20_all_best.csv',index=False)
          if len(z):
              t=z[z.metric=='best_total'].sort_values(['years','total_pnl_pct'],ascending=[True,False])
              g=z[z.metric=='best_grid'].sort_values(['years','grid_profit_pct'],ascending=[True,False])
              t.to_csv('grid_top20_total_ranking.csv',index=False)
              g.to_csv('grid_top20_gridprofit_ranking.csv',index=False)
              robust=t.groupby('symbol',as_index=False).agg(windows=('years','count'),median_total=('total_pnl_pct','median'),mean_total=('total_pnl_pct','mean'),worst_total=('total_pnl_pct','min'),median_dd=('max_drawdown_pct','median')).merge(g.groupby('symbol',as_index=False).agg(median_grid=('grid_profit_pct','median'),mean_grid=('grid_profit_pct','mean'),worst_grid=('grid_profit_pct','min')),on='symbol',how='outer')
              robust['score']=robust.median_total+0.5*robust.median_grid-0.25*robust.median_dd
              robust.sort_values(['windows','score'],ascending=[False,False]).to_csv('grid_top20_robust.csv',index=False)
          PY
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: grid-top20-aggregate
          path: grid_top20_*.csv
          retention-days: 7
